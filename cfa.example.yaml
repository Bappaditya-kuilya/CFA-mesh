otel_endpoint: http://127.0.0.1:4318
# Model: pick ONE. Small models only per spec — no 70b versatile.
# Local (no key, zero exfil):
#   default_model: ollama/qwen2.5-coder:1.5b
#   default_model: ollama/qwen2.5-coder:3b
#   default_model: ollama/gemma2:2b
# API (needs key, fast resampling):
#   default_model: groq/qwen-2.5-coder-32b
#   default_model: groq/gemma2-9b-it
default_model: ollama/qwen2.5-coder:1.5b
provider:
  kind: ollama  # ollama | groq | openai-compatible
  base_url: http://localhost:11434/v1  # groq: https://api.groq.com/openai/v1
  api_key_env: ""  # groq: GROQ_API_KEY | openai-compatible: CUSTOM_API_KEY; empty = local, no key sent
  timeout_s: 120
run_tier: pr
concurrency: {pr: 10, nightly: 20}
cache: true
budgets: {max_tokens_per_trace: 8000, max_cost_usd: 0.05, timeout_s: 120}
store: sqlite:///cfa.db
ui: {bind: 127.0.0.1:6006}
