name: CFA gate

# PRD refs: section 5 (CI PR gate small, nightly 02:00 full), F2 (PR tier
# 20 tasks x 2 branches; nightly --limit 200), section 7.3 (lockfile +
# pip-audit, full-length SHA pins, contents:read, never
# pull_request_target + fork checkout).
permissions:
  contents: read

on:
  pull_request: # PR tier gate; no pull_request_target (fork-safe per 7.3)
  schedule:
    - cron: "0 2 * * *" # nightly full tier 02:00 UTC
  workflow_dispatch:

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2 full SHA
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] 2>/dev/null || pip install pytest
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc || pip-audit
      - name: PR tier gate (20 tasks x 2 branches)
        run: pytest --run-eval --limit 20 -q

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned: v4.2.2 full SHA
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] 2>/dev/null || pip install pytest
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc || pip-audit
      - name: Nightly full tier (limit 200)
        run: pytest --run-eval --limit 200 -q
